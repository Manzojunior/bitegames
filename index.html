<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한입게임 · BiteGames</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: #faf8ef;
    color: #2c3e50;
    min-height: 100vh;
    padding: 40px 20px;
    line-height: 1.5;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  h1 {
    font-size: 48px;
    margin-bottom: 8px;
    color: #2c3e50;
    text-shadow: 3px 3px 0 #f1c40f;
  }
  .tagline { color: #7f8c8d; font-size: 18px; }
  .games {
    display: grid;
    gap: 16px;
  }
  .game-card {
    background: #fff;
    border: 3px solid #2c3e50;
    border-radius: 12px;
    padding: 20px 24px;
    box-shadow: 6px 6px 0 #2c3e50;
    transition: transform .15s, box-shadow .15s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .game-card:hover {
    transform: translate(2px, 2px);
    box-shadow: 4px 4px 0 #2c3e50;
  }
  .game-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .game-desc {
    color: #7f8c8d;
    font-size: 14px;
  }
  .game-meta {
    margin-top: 8px;
    font-size: 12px;
    color: #95a5a6;
  }
  footer {
    margin-top: 60px;
    text-align: center;
    color: #95a5a6;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍡 한입게임</h1>
      <p class="tagline">한입에 즐기는 가벼운 브라우저 미니게임 모음</p>
    </header>
    <div class="games">
      <a class="game-card" href="customer_satisfaction.html">
        <div class="game-title">고객 만족을 향하여 🏃‍♀️</div>
        <div class="game-desc">상담사 횡스크롤 러너 · 양해와 공감을 모아 만족 100% 도달</div>
        <div class="game-meta">조작: 좌우 화살표 / 스페이스 점프 · 모바일 터치 OK</div>
      </a>
    </div>
    <footer>
      © manzo · 더 많은 게임은 곧 추가될 예정입니다 🎮
    </footer>
  </div>
</body>
</html>
