<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>다람쥐의 쳇바퀴 30초 도전 (Squirrel Wheel)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: #1a1a2e;
    display: flex; justify-content: center; align-items: center;
    touch-action: none; user-select: none;
  }
  #game {
    position: relative;
    width: 100%; max-width: 480px;
    height: 720px; max-height: 100vh;
    background: linear-gradient(180deg, #2c3e50 0%, #34495e 60%, #1a1a2e 100%);
    overflow: hidden;
    border: 4px solid #f1c40f;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(241, 196, 15, 0.3);
  }

  /* HUD */
  #hud {
    position: absolute; top: 16px; left: 16px; right: 16px;
    z-index: 20; display: flex; justify-content: space-between;
    color: #fff; font-weight: 900;
    text-shadow: 2px 2px 0 #000;
  }
  .hud-card {
    background: rgba(0,0,0,0.5);
    padding: 8px 14px;
    border: 2px solid #f1c40f;
    border-radius: 8px;
  }
  .hud-card .label { font-size: 10px; opacity: 0.7; }
  .hud-card .value { font-size: 24px; color: #f1c40f; }

  /* Wheel */
  #wheel-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 360px; height: 360px;
  }
  #wheel {
    width: 100%; height: 100%;
    position: relative;
    will-change: transform;
  }
  #wheel svg { width: 100%; height: 100%; }
  /* spokes */
  .spoke { stroke: #d4a574; stroke-width: 8; }
  .frame-outer { stroke: #8b5a2b; stroke-width: 12; fill: none; }
  .frame-inner { stroke: #6f3f1a; stroke-width: 4; fill: none; }
  .grip { fill: #5a3315; }

  /* Marker — fixed, doesn't rotate */
  #marker {
    position: absolute;
    top: -6px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 28px solid #e74c3c;
    z-index: 5;
    filter: drop-shadow(0 0 8px #e74c3c);
  }
  /* Target zone arc — fixed at top */
  #target-zone {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 50px;
    border-top: 4px solid rgba(241,196,15,0.6);
    border-left: 4px solid rgba(241,196,15,0.6);
    border-right: 4px solid rgba(241,196,15,0.6);
    border-radius: 50% 50% 0 0;
    pointer-events: none;
    z-index: 4;
  }

  /* Squirrel inside wheel — rotates with wheel */
  #squirrel {
    position: absolute;
    bottom: 36px; left: 50%;
    transform: translateX(-50%);
    width: 64px; height: 64px;
    z-index: 6;
    pointer-events: none;
  }
  #squirrel img {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; image-rendering: pixelated;
    transform: scaleX(-1); /* face right (toward direction of motion) */
  }

  /* Floating feedback text */
  .feedback {
    position: absolute;
    left: 50%; top: 35%;
    transform: translateX(-50%) translateY(0);
    font-size: 56px; font-weight: 900;
    z-index: 15;
    pointer-events: none;
    text-shadow: 4px 4px 0 #000;
    animation: feedbackUp 0.9s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes feedbackUp {
    0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    50% { transform: translateX(-50%) translateY(-30px) scale(1.2); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-100px) scale(0.9); }
  }
  .fb-perfect { color: #f1c40f; }
  .fb-great { color: #2ecc71; }
  .fb-good { color: #3498db; }
  .fb-miss { color: #e74c3c; }

  /* Combo */
  #combo {
    position: absolute;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    color: #f39c12;
    font-size: 24px; font-weight: 900;
    text-shadow: 2px 2px 0 #000;
    z-index: 15;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  #combo.visible { opacity: 1; }

  /* Acorns counter */
  #acorns {
    position: absolute;
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 28px;
    color: #f1c40f;
    font-weight: 900;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
  }

  /* Action button */
  #stop-btn {
    position: absolute;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    width: 220px; height: 70px;
    background: #e74c3c;
    color: #fff;
    border: 4px solid #fff;
    border-radius: 12px;
    font-size: 32px; font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 #c0392b;
    transition: all .1s;
    user-select: none;
    z-index: 12;
  }
  #stop-btn:active {
    transform: translateX(-50%) translateY(4px);
    box-shadow: 0 2px 0 #c0392b;
  }

  /* Screen overlays */
  .screen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 30;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 30px;
  }
  .screen h1 {
    color: #f1c40f;
    font-size: 36px; margin-bottom: 16px;
    text-shadow: 4px 4px 0 #000;
  }
  .screen p {
    color: #fff;
    font-size: 16px;
    margin: 6px 0;
    line-height: 1.5;
  }
  .screen strong { color: #f39c12; }
  .screen button {
    margin-top: 24px;
    padding: 14px 32px;
    font-size: 22px; font-weight: 900;
    background: #f1c40f;
    color: #1a1a2e;
    border: 4px solid #fff;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 0 #b8860b;
  }
  .screen button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b8860b;
  }

  #end-screen { display: none; }
  #end-screen .stat-row {
    display: flex; justify-content: space-between;
    width: 280px;
    color: #fff; font-size: 18px;
    margin: 4px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.3);
    padding: 4px 0;
  }
  #end-screen .stat-row .v { color: #f1c40f; font-weight: 900; }
</style>
</head>

    <div id="hud">
      <div class="hud-card">

    <div class="screen" id="start-screen">
      <h1>🐿️ 다람쥐의 쳇바퀴 30초 도전</h1>
      <p><strong>'대리급 다람쥐'</strong>의 일상 — 끝없는 쳇바퀴.</p>
      <p>30초 동안 빨간 마커에 맞춰 쳇바퀴 멈추기!</p>
      <p>⭐ <strong>PERFECT</strong> = 100점 + 콤보</p>
      <p>⚪ <strong>GREAT</strong> = 50점</p>
      <p>🔵 <strong>GOOD</strong> = 20점</p>
      <p>❌ <strong>MISS</strong> = 콤보 끊김</p>
      <p style="margin-top:16px;">조작: <strong>스페이스바</strong> 또는 <strong>멈춰! 버튼</strong></p>
      <p style="font-size:13px; opacity:0.7; margin-top:12px;">각오는 단단히 — 30초만 더... 30초만 더...</p>
      <button id="start-btn">출근하기</button>
    </div>

    <!-- End screen -->
    <div class="screen" id="end-screen">
      <h1 id="end-title">🏆 퇴근 완료!</h1>
      <div class="stat-row"><span>최종 점수</span><span class="v" id="final-score">0</span></div>
      <div class="stat-row"><span>최고 콤보</span><span class="v" id="final-combo">0</span></div>
      <div class="stat-row"><span>PERFECT</span><span class="v" id="final-perfect">0</span></div>
      <div class="stat-row"><span>GREAT</span><span class="v" id="final-great">0</span></div>
      <div class="stat-row"><span>GOOD</span><span class="v" id="final-good">0</span></div>
      <div class="stat-row"><span>MISS</span><span class="v" id="final-miss">0</span></div>
      <p id="end-msg" style="margin-top:16px; max-width:300px; color:#f39c12;"></p>
      <button onclick="location.reload()">다시 출근</button>
    </div>
  </div>

<script>
// ==== Config ====
const ROUND_DURATION = 30; // seconds
const TARGET_RANGE_PERFECT = 5;   // ±5 deg
const TARGET_RANGE_GREAT = 15;
const TARGET_RANGE_GOOD = 30;
// Wheel rotates clockwise. Marker at top = angle 0.
// We track wheel rotation in degrees (continuous), modulo 360.

// ==== State ====
let isRunning = false;
let score = 0;
let combo = 0;
let maxCombo = 0;
let counts = { perfect: 0, great: 0, good: 0, miss: 0 };
let speed = 220; // deg per second initial
let wheelAngle = 0;
let lastTime = 0;
let timeLeft = ROUND_DURATION;
let canStop = false; // requires release between presses

// ==== DOM ====
const wheelEl = document.getElementById('wheel');
const scoreVal = document.getElementById('score-val');
const timeVal = document.getElementById('time-val');
const acornsEl = document.getElementById('acorns');
const comboEl = document.getElementById('combo');
const stopBtn = document.getElementById('stop-btn');
const startBtn = document.getElementById('start-btn');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const gameEl = document.getElementById('game');

// ==== Audio ====
let audioCtx;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(freq, type, dur, vol = 0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function sfxPerfect() {
  tone(880, 'square', 0.08, 0.15);
  setTimeout(() => tone(1320, 'square', 0.12, 0.15), 60);
  setTimeout(() => tone(1760, 'square', 0.18, 0.12), 130);
}
function sfxGreat() { tone(660, 'square', 0.1, 0.12); setTimeout(() => tone(990, 'square', 0.12, 0.1), 60); }
function sfxGood() { tone(440, 'square', 0.1, 0.1); }
function sfxMiss() { tone(180, 'sawtooth', 0.25, 0.1); }
function sfxTick() { tone(2000, 'square', 0.04, 0.05); }

// ==== Game logic ====
function start() {
  isRunning = true;
  score = 0; combo = 0; maxCombo = 0;
  counts = { perfect: 0, great: 0, good: 0, miss: 0 };
  speed = 220;
  wheelAngle = 0;
  timeLeft = ROUND_DURATION;
  lastTime = performance.now();
  canStop = true;
  startScreen.style.display = 'none';
  scoreVal.textContent = '0';
  timeVal.textContent = ROUND_DURATION;
  acornsEl.textContent = '🌰 ×0';
  requestAnimationFrame(loop);
}

function loop(now) {
  if (!isRunning) return;
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // Update wheel rotation (clockwise)
  wheelAngle = (wheelAngle + speed * dt) % 360;
  wheelEl.style.transform = `rotate(${wheelAngle}deg)`;
  tickSquirrelAnim(dt);

  // Update timer
  timeLeft -= dt;
  if (timeLeft <= 0) {
    end();
    return;
  }
  timeVal.textContent = Math.ceil(timeLeft);

  // Tick sound at last 5 seconds
  if (timeLeft < 5 && Math.floor(timeLeft) !== Math.floor(timeLeft + dt)) {
    sfxTick();
  }

  requestAnimationFrame(loop);
}

function tryStop() {
  if (!isRunning || !canStop) return;
  canStop = false;
  setTimeout(() => { canStop = true; }, 250);

  // Compute distance to top (angle 0, wrapped)
  // Wheel rotated by wheelAngle clockwise — marker at top.
  // Distance from "top" considering wrap: min(angle, 360 - angle).
  let dist = wheelAngle % 360;
  if (dist > 180) dist = 360 - dist;

  let result, points;
  if (dist <= TARGET_RANGE_PERFECT) {
    result = 'PERFECT'; points = 100;
    counts.perfect++; combo++;
    sfxPerfect();
  } else if (dist <= TARGET_RANGE_GREAT) {
    result = 'GREAT'; points = 50;
    counts.great++; combo++;
    sfxGreat();
  } else if (dist <= TARGET_RANGE_GOOD) {
    result = 'GOOD'; points = 20;
    counts.good++; combo++;
    sfxGood();
  } else {
    result = 'MISS'; points = 0;
    counts.miss++;
    combo = 0;
    sfxMiss();
  }

  // Combo multiplier
  let multiplier = 1;
  if (combo >= 5) multiplier = 2;
  else if (combo >= 3) multiplier = 1.5;
  const earned = Math.floor(points * multiplier);
  score += earned;

  if (combo > maxCombo) maxCombo = combo;

  // Update UI
  scoreVal.textContent = score;
  acornsEl.textContent = `🌰 ×${counts.perfect + counts.great + counts.good}`;
  if (combo >= 2) {
    comboEl.textContent = multiplier > 1 ? `콤보 ×${combo} (${multiplier}x)` : `콤보 ×${combo}`;
    comboEl.classList.add('visible');
  } else {
    comboEl.classList.remove('visible');
  }

  // Floating text
  showFeedback(result, earned);

  // Speed up wheel (gradual)
  if (result !== 'MISS') {
    speed = Math.min(540, speed + 12);
  }
}

function showFeedback(text, earned) {
  const fb = document.createElement('div');
  fb.className = 'feedback fb-' + text.toLowerCase();
  if (earned > 0) fb.textContent = `${text} +${earned}`;
  else fb.textContent = text;
  gameEl.appendChild(fb);
  setTimeout(() => fb.remove(), 900);
}

function end() {
  isRunning = false;
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-combo').textContent = maxCombo;
  document.getElementById('final-perfect').textContent = counts.perfect;
  document.getElementById('final-great').textContent = counts.great;
  document.getElementById('final-good').textContent = counts.good;
  document.getElementById('final-miss').textContent = counts.miss;

  let msg = "고생했어요... 내일도 출근입니다 🐿️";
  if (score >= 3000) msg = "🏆 전설의 다람쥐! 이 정도면 대리 → 과장 승진감";
  else if (score >= 2000) msg = "👏 베테랑 다람쥐. 이번 분기 성과급 확정";
  else if (score >= 1000) msg = "👍 평균 이상. 야근은 면제";
  else if (score >= 500) msg = "😅 평타. 내일도 같은 시간 같은 쳇바퀴";
  else msg = "💀 권고사직 후보. 30초만 더... 30초만 더...";
  document.getElementById('end-msg').textContent = msg;

  endScreen.style.display = 'flex';
}

// ==== Input ====
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowDown') {
    e.preventDefault();
    if (!isRunning && startScreen.style.display !== 'none') {
      initAudio(); start();
    } else {
      tryStop();
    }
  }
});

stopBtn.addEventListener('click', () => { tryStop(); });
stopBtn.addEventListener('touchstart', (e) => { e.preventDefault(); tryStop(); }, { passive: false });

startBtn.addEventListener('click', () => { initAudio(); start(); });

// PixelLab squirrel image — try to load if available
// (will be set when integrated; for now, fallback CSS shape used)

// Squirrel running animation — toggle frames at speed-based rate
let frameIdx = 0;
let frameElapsed = 0;
function tickSquirrelAnim(dt) {
  if (!isRunning) return;
  // frame rate scales with wheel speed (faster = faster legs)
  const interval = Math.max(0.06, 0.18 - speed * 0.0002);
  frameElapsed += dt;
  if (frameElapsed >= interval) {
    frameElapsed = 0;
    frameIdx = 1 - frameIdx;
    document.getElementById('squirrel-frame-0').style.display = frameIdx === 0 ? 'block' : 'none';
    document.getElementById('squirrel-frame-1').style.display = frameIdx === 1 ? 'block' : 'none';
  }
}
// Hook into loop
</script>
</body>
</html>
